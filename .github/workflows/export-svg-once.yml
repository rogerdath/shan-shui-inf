name: Export SVG once

on:
  push:
    branches:
      - agent/add-profile-architecture
    paths:
      - .github/workflows/export-svg-once.yml

permissions:
  contents: write

jobs:
  export-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-profile-architecture

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/shan-shui-server.log 2>&1 &
          echo $! > /tmp/shan-shui-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shan-shui-server.log
          exit 1

      - name: Export deterministic scene
        env:
          SCENE_URL: http://127.0.0.1:8000
          SCENE_SEED: mo-i-rana
          SCENE_PROFILE: norway
          SCENE_OUTPUT: examples/mo-i-rana-norway.svg
        run: node scripts/export-scene-svg.mjs

      - name: Validate SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET

          path = Path('examples/mo-i-rana-norway.svg')
          data = path.read_bytes()
          root = ET.fromstring(data)
          assert root.tag == '{http://www.w3.org/2000/svg}svg', root.tag
          assert len(data) > 10000, len(data)
          assert b'NaN' not in data
          digest = hashlib.sha256(data).hexdigest()
          report = f'''# SVG export test

Result: **PASSED**

- File: `examples/mo-i-rana-norway.svg`
- Seed: `mo-i-rana`
- Profile: `norway`
- Bytes: {len(data):,}
- SHA-256: `{digest}`
- XML parsing: PASS
- Standalone SVG namespace: PASS
- Browser errors: none
- `NaN` values: none

The Norway profile currently inherits the original visual generator, so this file is a stable baseline example rather than a Norwegianized landscape.
'''
          Path('docs/svg-export-test.md').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Commit SVG and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/mo-i-rana-norway.svg docs/svg-export-test.md
          git commit -m "Add tested Mo i Rana SVG example"
          git push origin HEAD:agent/add-profile-architecture
