name: Profile regression once

on:
  push:
    branches:
      - agent/add-profile-architecture
    paths:
      - .github/workflows/profile-regression-once.yml

permissions:
  contents: write

jobs:
  verify-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-profile-architecture
          fetch-depth: 0

      - name: Prepare master baseline
        run: |
          git fetch origin master
          git worktree add /tmp/shan-shui-master origin/master

      - name: Run structural checks
        run: |
          node scripts/verify-refactor.mjs
          node scripts/verify-profiles.mjs

      - name: Install Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Compare profiles in Chromium
        shell: bash
        run: |
          python3 -m http.server 8001 --directory /tmp/shan-shui-master >/tmp/shan-shui-master.log 2>&1 &
          python3 -m http.server 8002 --directory . >/tmp/shan-shui-profile.log 2>&1 &
          sleep 2

          set +e
          BASELINE_URL=http://127.0.0.1:8001 \
          CURRENT_URL=http://127.0.0.1:8002 \
          REPORT_PATH=docs/profile-browser-test.md \
          node scripts/verify-browser-profiles.mjs
          test_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/profile-browser-test.md
          git commit -m "Record scene profile browser regression"
          git push origin HEAD:agent/add-profile-architecture

          exit "$test_status"
