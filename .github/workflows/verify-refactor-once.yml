name: Verify refactor once

on:
  push:
    branches:
      - agent/refactor-index-structure
    paths:
      - .github/workflows/verify-refactor-once.yml

permissions:
  contents: write

jobs:
  verify-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-index-structure

      - name: Verify script layout and syntax
        shell: bash
        run: |
          set +e
          node scripts/verify-refactor.mjs > refactor-verification.log 2>&1
          status=$?
          echo "verify_status=$status" >> refactor-verification.log
          cat refactor-verification.log

      - name: Commit verification result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refactor-verification.log
          git diff --cached --stat
          git commit -m "Record refactor verification"
          git push origin HEAD:agent/refactor-index-structure
