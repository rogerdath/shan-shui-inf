name: Refactor index once

on:
  push:
    branches:
      - agent/refactor-index-structure
    paths:
      - .github/workflows/refactor-index-once.yml

permissions:
  contents: write

jobs:
  split-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-index-structure

      - name: Run and record generator split
        shell: bash
        run: |
          set +e
          {
            echo "## split-generator"
            node scripts/split-generator.mjs
            split_status=$?
            echo "split_status=$split_status"
            if [ "$split_status" -eq 0 ]; then
              echo "## verify-refactor"
              node scripts/verify-refactor.mjs
              verify_status=$?
              echo "verify_status=$verify_status"
            else
              verify_status=99
            fi
            echo "result=$([ "$split_status" -eq 0 ] && [ "$verify_status" -eq 0 ] && echo success || echo failure)"
          } > refactor-generator.log 2>&1
          cat refactor-generator.log

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Record generator refactor result"
          git push origin HEAD:agent/refactor-index-structure
