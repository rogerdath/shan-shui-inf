name: Refactor index once

on:
  push:
    branches:
      - agent/refactor-index-structure
    paths:
      - .github/workflows/refactor-index-once.yml

permissions:
  contents: write

jobs:
  split-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-index-structure

      - name: Split generator domains
        run: node scripts/split-generator.mjs

      - name: Verify generated structure
        run: node scripts/verify-refactor.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Split generator into focused modules"
          git push origin HEAD:agent/refactor-index-structure
